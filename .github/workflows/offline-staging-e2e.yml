name: offline-staging-e2e

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  authenticated-offline:
    if: github.repository == 'Pacifique-Gdm/acadea-app' && github.ref == 'refs/heads/codex/offline-staging-e2e-20261028'
    runs-on: ubuntu-latest
    environment: acadea-staging-e2e
    timeout-minutes: 50
    concurrency:
      group: offline-staging-e2e
      cancel-in-progress: false
    env:
      ACADEA_STAGING_E2E: 'YES'
      ACADEA_E2E_BASE_URL: http://127.0.0.1:4173
      VITE_APP_ENV: staging
      VITE_FIREBASE_PROJECT_ID: acadea-staging
      VITE_FIREBASE_API_KEY: ${{ vars.STAGING_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.STAGING_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.STAGING_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.STAGING_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.STAGING_FIREBASE_APP_ID }}
      GOOGLE_CLOUD_PROJECT: acadea-staging
      GCLOUD_PROJECT: acadea-staging
      VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
      GCP_STAGING_E2E_SERVICE_ACCOUNT: ${{ vars.GCP_STAGING_E2E_SERVICE_ACCOUNT }}
      GCP_STAGING_WIF_PROVIDER: ${{ vars.GCP_STAGING_WIF_PROVIDER }}
    steps:
      - uses: actions/checkout@v4
      - name: Bloquer toute cible autre que Firebase Staging
        shell: bash
        run: |
          test "$GITHUB_REF" = 'refs/heads/codex/offline-staging-e2e-20261028'
          test "$GITHUB_REPOSITORY" = 'Pacifique-Gdm/acadea-app'
          test "$GOOGLE_CLOUD_PROJECT" = 'acadea-staging'
          test "$VITE_FIREBASE_PROJECT_ID" = 'acadea-staging'
          test "$VITE_FIREBASE_AUTH_DOMAIN" = 'acadea-staging.firebaseapp.com'
          test "$VITE_FIREBASE_STORAGE_BUCKET" = 'acadea-staging.firebasestorage.app'
          for key in VITE_FIREBASE_API_KEY VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID; do
            test -n "${!key}" || { echo "Variable Staging manquante: $key"; exit 1; }
          done
          test -n "$GCP_STAGING_WIF_PROVIDER" || { echo 'Fournisseur WIF Staging manquant'; exit 1; }
          [[ "$GCP_STAGING_E2E_SERVICE_ACCOUNT" == *@acadea-staging.iam.gserviceaccount.com ]] || { echo 'Compte de service E2E hors projet Staging'; exit 1; }
      - uses: google-github-actions/auth@v3
        id: federated_auth
        with:
          project_id: acadea-staging
          workload_identity_provider: ${{ vars.GCP_STAGING_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_STAGING_E2E_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build Staging officiel avec configuration publique vérifiée
        run: npm run build:staging
      - name: Démarrer l'interface construite
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/acadea-preview.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/version.json > /dev/null; then exit 0; fi
            sleep 1
          done
          echo 'Preview local indisponible'; exit 1
      - name: Confirmer le SHA de l'artefact testé
        shell: bash
        run: |
          node -e 'const v = require("./dist/version.json"); if (v.version !== process.env.GITHUB_SHA) process.exit(1)'
          curl --fail --silent http://127.0.0.1:4173/version.json | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{if(JSON.parse(s).version!==process.env.GITHUB_SHA)process.exit(1)})'
      - name: Créer la fixture isolée
        shell: bash
        run: |
          e2e_password="$(openssl rand -hex 32)"
          echo "::add-mask::$e2e_password"
          echo "ACADEA_E2E_PASSWORD=$e2e_password" >> "$GITHUB_ENV"
          node scripts/offlineStagingFixture.mjs prepare
      - name: Recette Playwright authentifiée sur Firebase Staging
        run: npx playwright test e2e/offline-staging-authenticated.spec.ts --workers=1 --retries=0
      - name: Nettoyage et vérification des ressources fictives
        if: always() && steps.federated_auth.outcome == 'success'
        run: node scripts/offlineStagingFixture.mjs cleanup
