name: authenticated-emulator-ci

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Une exécution devenue inutile (nouvel envoi sur la même PR) est annulée ; seule la dernière compte.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  authenticated-emulator-e2e:
    name: authenticated-emulator-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ACADEA_E2E_LOCAL_EMULATORS: 'YES'
      ACADEA_E2E_FEE_HANDLER: 'YES'
      ACADEA_E2E_BASE_URL: http://127.0.0.1:4173
      VITE_LOCAL_EMULATORS: 'true'
      VITE_FIREBASE_PROJECT_ID: demo-acadea
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      FIREBASE_STORAGE_EMULATOR_HOST: 127.0.0.1:9199
      VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Outils de test gardés (émulateurs Firebase et navigateur)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/firebase/emulators
            ~/.cache/ms-playwright
          key: outils-e2e-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-firebase-15.25.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Bundle exclusivement destiné aux émulateurs
        run: npx vite build --mode test
      - name: Navigation et formulaires réels — Chromium local
        run: npx playwright test --config playwright.navigation.config.ts
      - name: Servir les composants et le bundle avec API locale en mode émulateurs
        run: |
          ACADEA_E2E_PORT=4187 node scripts/serveEmulatorBundle.mjs > /tmp/acadea-fee-preview.log 2>&1 &
          npx vite --mode test --host 127.0.0.1 --port 4173 > /tmp/acadea-preview.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/version.json > /dev/null && curl --fail --silent http://127.0.0.1:4187/version.json > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/version.json > /dev/null && curl --fail --silent http://127.0.0.1:4187/version.json > /dev/null || exit 1
          # Préparation à l'avance : l'écran de connexion demande l'image de connexion (/api/manage-school).
          # Le serveur Vite de test prépare alors firebase-admin à la volée et recharge la page en plein essai
          # (« Teacher documents » instable). On déclenche cette préparation ici, avant le premier essai.
          curl --silent --output /dev/null "http://127.0.0.1:4173/api/manage-school?action=login-image" || true
          for attempt in $(seq 1 120); do
            if grep -q '"firebase-admin/app"' node_modules/.vite/deps/_metadata.json 2>/dev/null; then echo "Préparation à l'avance terminée."; exit 0; fi
            sleep 1
          done
          echo "::warning::Préparation à l'avance de firebase-admin non constatée après 120 s."
      - name: Recette des vrais composants et handlers sur émulateurs
        run: >-
          npx --yes firebase-tools@15.25.0 emulators:exec
          --project demo-acadea --config firebase.emulators.recipe.json --only auth,firestore,storage
          "npx playwright test e2e/.*-emulator.spec.ts --grep-invert 'incident frais' --output=test-results/components --workers=1 --retries=0 && ACADEA_E2E_BASE_URL=http://127.0.0.1:4187 npx playwright test e2e/fee-incident-emulator.spec.ts --output=test-results/fees --workers=1 --retries=0"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authenticated-emulator-proofs
          path: |
            test-results/**/*.pdf
            test-results/**/*.png
            test-results/**/*.json
            test-results/**/*.html
            test-results/**/error-context.md
          retention-days: 7
