name: section-admin-staging-preflight
on:
  workflow_dispatch:
  push:
    branches: [codex/section-admin-profiles-final-20261031]
    paths:
      - '.github/workflows/section-admin-staging-preflight.yml'
permissions:
  contents: read
jobs:
  access:
    if: github.repository == 'Pacifique-Gdm/acadea-app' && github.ref == 'refs/heads/codex/section-admin-profiles-final-20261031'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: acadea-staging-e2e
    permissions:
      contents: read
      id-token: write
    env:
      GOOGLE_CLOUD_PROJECT: acadea-staging
      PROVIDER: ${{ vars.GCP_STAGING_WIF_PROVIDER }}
      SERVICE_ACCOUNT: ${{ vars.GCP_STAGING_E2E_SERVICE_ACCOUNT }}
    steps:
      - name: Validate configuration without printing values
        shell: bash
        run: |
          test "$GOOGLE_CLOUD_PROJECT" = acadea-staging
          [[ "$PROVIDER" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[^/]+/providers/[^/]+$ ]] || { echo 'GCP_STAGING_WIF_PROVIDER missing or invalid'; exit 1; }
          [[ "$SERVICE_ACCOUNT" =~ ^[^@]+@acadea-staging\.iam\.gserviceaccount\.com$ ]] || { echo 'GCP_STAGING_E2E_SERVICE_ACCOUNT missing or invalid'; exit 1; }
      - uses: google-github-actions/auth@v3
        with:
          project_id: acadea-staging
          workload_identity_provider: ${{ env.PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: false
      - name: Report scope
        run: echo 'Federated authentication only. No fixture, deployment, hosted recipe or permission test has been executed.'
