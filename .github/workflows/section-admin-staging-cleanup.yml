name: section-admin-staging-cleanup
on:
  push:
    branches: [codex/section-admin-profiles-final-20261031]
    paths:
      - '.github/workflows/section-admin-staging-cleanup.yml'
  workflow_dispatch:
    inputs:
      source_run:
        description: Identifiant du run de recette interrompu
        required: true
        type: string
      source_attempt:
        description: Numéro de tentative du run
        required: true
        type: string
      preview_url:
        description: URL Preview du run interrompu
        required: true
        type: string
      candidate_sha:
        description: SHA complet du run interrompu
        required: true
        type: string
permissions:
  contents: read
jobs:
  cleanup:
    if: github.repository == 'Pacifique-Gdm/acadea-app' && github.ref == 'refs/heads/codex/section-admin-profiles-final-20261031'
    environment: acadea-staging-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: section-admin-staging-recipe
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GOOGLE_CLOUD_PROJECT: acadea-staging
      ACADEA_SECTION_RECIPE_AUTHORIZED: YES
      ACADEA_SECTION_PREVIEW_URL: ${{ inputs.preview_url || vars.ACADEA_SECTION_PREVIEW_URL || 'https://acadea-staging.vercel.app/' }}
      ACADEA_EXPECTED_SHA: ${{ inputs.candidate_sha || vars.ACADEA_SECTION_RECOVERY_SHA }}
      STAGING_FIREBASE_STORAGE_BUCKET: ${{ vars.STAGING_FIREBASE_STORAGE_BUCKET }}
      SOURCE_RUN: ${{ inputs.source_run || vars.ACADEA_SECTION_RECOVERY_RUN }}
      SOURCE_ATTEMPT: ${{ inputs.source_attempt || vars.ACADEA_SECTION_RECOVERY_ATTEMPT }}
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la provenance du manifeste
        uses: actions/github-script@v7
        with:
          script: |
            if (!/^\d+$/.test(process.env.SOURCE_RUN) || !/^\d+$/.test(process.env.SOURCE_ATTEMPT)) throw new Error('Run invalide');
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: Number(process.env.SOURCE_RUN)});
            if (run.head_repository?.full_name !== 'Pacifique-Gdm/acadea-app' || run.head_branch !== 'codex/section-admin-profiles-final-20261031' || run.path !== '.github/workflows/section-admin-staging-recipe.yml' || !['workflow_dispatch', 'push'].includes(run.event) || run.status !== 'completed' || run.head_sha !== process.env.ACADEA_EXPECTED_SHA || String(run.run_attempt) !== process.env.SOURCE_ATTEMPT) throw new Error('Run non admissible');
      - uses: actions/download-artifact@v4
        with:
          name: section-fixture-manifest-${{ env.SOURCE_RUN }}-${{ env.SOURCE_ATTEMPT }}
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
          path: test-results
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: google-github-actions/auth@v3
        with:
          project_id: acadea-staging
          workload_identity_provider: ${{ vars.GCP_STAGING_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_STAGING_E2E_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - name: Clôturer les comptes du manifeste sauvegardé, sans suppression
        run: node scripts/sectionStagingFixture.mjs retire
      - uses: actions/upload-artifact@v4
        with:
          name: section-cleanup-confirmation-${{ github.run_id }}
          path: test-results/section-staging-manifest.json
          retention-days: 7
