name: preproduction-ci

on:
  pull_request:
    branches: [main, codex/offline-secure-20261027]
  workflow_dispatch:
    inputs:
      run_offline_staging_e2e:
        description: 'Exécuter la recette hors connexion authentifiée sur acadea-staging'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  offline-emulator-e2e:
    name: offline-emulator-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ACADEA_E2E_LOCAL_EMULATORS: 'YES'
      ACADEA_E2E_BASE_URL: http://127.0.0.1:4173
      VITE_LOCAL_EMULATORS: 'true'
      VITE_FIREBASE_PROJECT_ID: demo-acadea
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      FIREBASE_STORAGE_EMULATOR_HOST: 127.0.0.1:9199
      VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Bundle réservé aux émulateurs (pas un build Staging)
        run: npx vite build --mode test
      - name: Servir le bundle local isolé
        run: |
          npx vite preview --mode test --host 127.0.0.1 --port 4173 > /tmp/acadea-emulator-preview.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/version.json > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Auth, Firestore et Storage locaux — vrais écrans et handlers
        run: >-
          npx --yes firebase-tools@15.25.0 emulators:exec
          --project demo-acadea --config firebase.emulators.recipe.json --only auth,firestore,storage
          "bash scripts/offlineEmulatorRecipe.sh"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-emulator-errors
          path: playwright-results/**/error-context.md
          retention-days: 7

  application-and-functions:
    name: application-and-functions
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm audit --omit=dev --audit-level=high
      - run: npm --prefix functions audit --omit=dev --audit-level=high
      - name: Vérifier le SHA testé
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - run: git diff --check
      - run: npm run test:pipeline
      - run: npm run lint
      - run: npx tsc -b --pretty false
      - run: npm run test:unit -- --maxWorkers=2
      - run: npm --prefix functions test
      - run: npm --prefix functions run build
      - name: Build Staging sans accès distant
        run: npm run build:staging
        env:
          VITE_FIREBASE_API_KEY: ci-build-only
          VITE_FIREBASE_AUTH_DOMAIN: acadea-staging.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: acadea-staging
          VITE_FIREBASE_STORAGE_BUCKET: acadea-staging.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: ci-build-only
          VITE_FIREBASE_APP_ID: ci-build-only

  firebase-rules:
    name: firebase-rules
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Firestore et Storage — émulateurs locaux uniquement
        run: >-
          npx --yes firebase-tools@15.25.0 emulators:exec
          --project demo-acadea-security-s1-s4 --only firestore,storage
          "npm run test:firestore -- --maxWorkers=2 && npm run test:storage -- --maxWorkers=2"

  offline-staging-e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.run_offline_staging_e2e == true
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/offline-staging-e2e.yml
